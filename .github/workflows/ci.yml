name: EYTGaming CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pip-audit
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Security scan with bandit
        run: bandit -r . -f json --quiet || true

      - name: Dependency audit with pip-audit
        run: pip-audit --requirement requirements.txt --strict || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eytgaming_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov factory_boy hypothesis

      - name: Run migrations
        run: python manage.py migrate
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: eytgaming_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_ENGINE: django.db.backends.postgresql

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=60 -x --tb=short
        env:
          DEBUG: 'True'
          SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: eytgaming_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_ENGINE: django.db.backends.postgresql
          VAPID_PUBLIC_KEY: test
          VAPID_PRIVATE_KEY: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
